add_newline = false

format = '$time$username$directory$git_branch$git_status$line_break$character'

[time]
disabled = false
format = '[$time]($style) with '
time_format = '%H:%M:%S'

[username]
show_always = true
format = '[$user]($style) in '

[directory]
truncate_to_repo = false

[character]
success_symbol = '[❯](bold blue)'
error_symbol = '[❯](bold red)'
