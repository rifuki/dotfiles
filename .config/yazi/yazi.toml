[mgr]
show_hidden    = false
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true

[preview]
tab_size   = 2
max_width  = 600
max_height = 900

[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "nvim" },
]
open = [
  { run = 'xdg-open "$@"', desc = "open" },
]

[open]
prepend_rules = [
  { mime = "text/*",           use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { mime = "application/xml",  use = "edit" },
]
