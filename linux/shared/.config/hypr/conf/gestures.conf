# =============================================================================
#  Gestures — trackpad and touchscreen
#  https://wiki.hypr.land/0.54.0/Configuring/Gestures/
#
#  Two independent systems live here:
#    1. Hyprland's own gestures  (`gesture` keyword + `gestures` block)
#    2. hyprgrass touch gestures (`plugin { touch_gestures { ... } }`)
#  The hyprgrass block only does anything while its plugin loads — see the ABI
#  note in autostart.conf.
# =============================================================================

# ── Hyprland built-in ────────────────────────────────────────────────────────
gesture = 4, horizontal, workspace              # 4-finger swipe = switch workspace

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_touch = true                # enable touchscreen swipe too
}

# ── hyprgrass plugin ─────────────────────────────────────────────────────────
plugin {
 touch_gestures {
  # The default sensitivity is probably too low on tablet screens,
  # I recommend turning it up to 4.0
  sensitivity = 4.0

  workspace_swipe = true
  workspace_swipe_fingers = 4
  workspace_swipe_cancel_ratio = 0.15

  long_press_delay = 400
  # resize windows by long-pressing on window borders and gaps.
  # If general:resize_on_border is enabled, general:extend_border_grab_area is
  # used for floating windows
  resize_on_border_long_press = true

  # in pixels, the distance from the edge that is considered an edge
  edge_margin = 10

  experimental {
    # send proper cancel events to windows instead of hacky touch_up events,
    # NOT recommended as it crashed a few times
    send_cancel = 0
  }
 }
}
