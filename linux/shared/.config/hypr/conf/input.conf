# =============================================================================
#  Input — keyboard, touchpad, per-device overrides
#  https://wiki.hypr.land/0.54.0/Configuring/Variables/#input
#  https://wiki.hypr.land/0.54.0/Configuring/Keywords/#per-device-input-configs
# =============================================================================

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_rate = 70                             # Key repeat speed (chars/sec)
    repeat_delay = 150                           # Delay before repeat starts (ms)

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true                    # macOS-style scrolling
        scroll_factor = 0.4                      # Scroll sensitivity
        middle_button_emulation = false          # Disable middle click emulation
        tap-to-click = true                      # Tap to click
        tap-and-drag = true                      # Tap and drag
        drag_lock = false                        # Disable drag lock
        disable_while_typing = true              # Disable touchpad while typing
        clickfinger_behavior = true              # 2-finger = right click, 3-finger = middle click
    }
}

# ── Per-device overrides ─────────────────────────────────────────────────────
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

device {
    name = ydotoold-virtual-device
    accel_profile = flat
    sensitivity = 0
}
