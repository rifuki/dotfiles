# =============================================================================
#  Keybindings
#  https://wiki.hypr.land/0.54.0/Configuring/Binds/
#  https://wiki.hypr.land/0.54.0/Configuring/Dispatchers/
#
#  Requires $terminal / $fileManager / $menu from programs.conf — keep that
#  sourced before this file.
# =============================================================================

$superMod = SUPER # Sets "Windows" key as main modifier
$ctrlMod = CTRL
$altMod = ALT

# ── Basic app controls (macOS style) ─────────────────────────────────────────
bind = $superMod, Q, killactive                    # ⌘+Q = Quit app
bind = $superMod, W, killactive                    # ⌘+W = Close window

# ── System ───────────────────────────────────────────────────────────────────
bind = $ctrlMod $altMod, L, exec, hyprlock                                # CTRL+ALT+L = Lock screen
bind = $ctrlMod $altMod, S, exec, systemctl suspend                       # CTRL+ALT+S = Suspend
bind = $superMod SHIFT, Q, exec, ~/.config/hypr/scripts/hypr-logout.sh    # ⌘+Shift+Q = Exit Hyprland

# ── Floating / grid / fullscreen ─────────────────────────────────────────────
bind = $superMod, return, exec, $HOME/.local/bin/float-toggle   # ⌘+Enter = Toggle float (auto 900x600 + center)
bind = $superMod, V, exec, $HOME/.local/bin/clipboard-paste     # ⌘+V = Clipboard picker + auto-paste
bind = $superMod, F, exec, $HOME/.local/bin/zoom-toggle         # ⌘+F = Zoom-fullscreen (yabai-style)
bind = $altMod, F, exec, $HOME/.local/bin/zoom-toggle           # Option+F = Zoom-fullscreen
bind = $superMod SHIFT, F, fullscreen, 0                        # ⌘+Shift+F = True fullscreen (hides waybar)
bind = $superMod SHIFT, RETURN, fullscreen, 0                   # ⌘+Shift+Enter = True fullscreen
bind = $superMod ALT, SPACE, exec, hyprctl dispatch togglefloating; hyprctl dispatch resizeactive exact 900 600; hyprctl dispatch movewindowpixel center

# ── Resize floating ──────────────────────────────────────────────────────────
binde = $superMod $ctrlMod, H, resizeactive, -40 0
binde = $superMod $ctrlMod, L, resizeactive, 40 0
binde = $superMod $ctrlMod, K, resizeactive, 0 -40
binde = $superMod $ctrlMod, J, resizeactive, 0 40

# ── Split ────────────────────────────────────────────────────────────────────
# `togglesplit` is a layoutmsg parameter, not a dispatcher. Hyprland 0.54 still
# accepted the bare alias; 0.56 rejects it with "Invalid dispatcher: togglesplit".
# Requires dwindle:preserve_split (set in layouts.conf).
bind = $superMod, E, layoutmsg, togglesplit  # dwindle

# ── Window focus ─────────────────────────────────────────────────────────────
bind = $superMod, H, movefocus, l
bind = $superMod, L, movefocus, r
bind = $superMod, K, movefocus, u
bind = $superMod, J, movefocus, d

# ── Swap windows ─────────────────────────────────────────────────────────────
bind = $superMod SHIFT, h, swapwindow, l
bind = $superMod SHIFT, j, swapwindow, d
bind = $superMod SHIFT, k, swapwindow, u
bind = $superMod SHIFT, l, swapwindow, r

# ── Workspaces (macOS Mission Control style) ─────────────────────────────────
bind = $superMod, TAB, workspace, previous  # Super+Tab = Last used workspace
bind = $superMod, p, workspace, e-1         # Previous workspace
bind = $superMod, n, workspace, e+1         # Next workspace
bind = $superMod, 1, workspace, 1
bind = $superMod, 2, workspace, 2
bind = $superMod, 3, workspace, 3
bind = $superMod, 4, workspace, 4
bind = $superMod, 5, workspace, 5
bind = $superMod, 6, workspace, 6
bind = $superMod, 7, workspace, 7
bind = $superMod, 8, workspace, 8
bind = $superMod, 9, workspace, 9
bind = $superMod, 0, workspace, 10

# ── Move window to workspace ─────────────────────────────────────────────────
bind = $superMod SHIFT, 1, movetoworkspace, 1
bind = $superMod SHIFT, 2, movetoworkspace, 2
bind = $superMod SHIFT, 3, movetoworkspace, 3
bind = $superMod SHIFT, 4, movetoworkspace, 4
bind = $superMod SHIFT, 5, movetoworkspace, 5
bind = $superMod SHIFT, 6, movetoworkspace, 6
bind = $superMod SHIFT, 7, movetoworkspace, 7
bind = $superMod SHIFT, 8, movetoworkspace, 8
bind = $superMod SHIFT, 9, movetoworkspace, 9
bind = $superMod SHIFT, 0, movetoworkspace, 10

# ── Special workspace (scratchpad) ───────────────────────────────────────────
bind = $superMod, S, togglespecialworkspace, magic
bind = $superMod SHIFT, S, movetoworkspace, special:magic

# ── Screenshots ──────────────────────────────────────────────────────────────
bind = , Print, exec, grim -l 0 - | wl-copy                                  # Print: full → clipboard (no compression)
bind = SHIFT, Print, exec, grim -l 0 -g "$(slurp)" - | wl-copy               # Shift+Print: crop → clipboard
bind = $superMod, Print, exec, $HOME/.local/bin/screenshot-copy              # Super+Print: full → clipboard + thumbnail
bind = $superMod SHIFT, Print, exec, $HOME/.local/bin/screenshot-area-copy   # Super+Shift+Print: crop → clipboard + thumbnail

# ── Mouse ────────────────────────────────────────────────────────────────────
bindm = $superMod, mouse:272, movewindow
bindm = $superMod, mouse:273, resizewindow

# ── Laptop media and brightness keys ─────────────────────────────────────────
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ── App shortcuts ────────────────────────────────────────────────────────────
bind = $ctrlMod, SPACE, exec, $menu                   # Spotlight (app launcher)
bind = $superMod, SPACE, exec, $menu                  # Spotlight (app launcher)
bind = $altMod, SPACE, exec, $menu                    # Spotlight (app launcher)
bind = $superMod, Y, exec, sh -lc '$HOME/.local/bin/wallpaper-picker'
bind = $superMod, X, exec, sh -lc '$HOME/.local/bin/actions'
bind = $superMod, F5, exec, sh -lc 'toggle-theme'     # ⌘+F5 = Toggle dark/light
bind = $ctrlMod $altMod, T, exec, $terminal           # CTRL+ALT+T = New terminal
bind = $ctrlMod $altMod, E, exec, $fileManager        # CTRL+ALT+E = File manager
