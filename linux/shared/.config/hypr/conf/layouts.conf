# =============================================================================
#  Layouts and workspace rules
#  https://wiki.hypr.land/0.54.0/Configuring/Dwindle-Layout/
#  https://wiki.hypr.land/0.54.0/Configuring/Master-Layout/
#  https://wiki.hypr.land/0.54.0/Configuring/Workspace-Rules/
# =============================================================================

# "Smart gaps" / "no gaps when only" — uncomment the whole block to use.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

dwindle {
    # NOTE: `pseudotile` was removed in Hyprland 0.55 — upstream dropped it
    # because it had no effect. Nothing here bound it, so removing it is a
    # no-op today and avoids an unknown-option error after the upgrade.
    preserve_split = true
}

master {
    new_status = master
}
