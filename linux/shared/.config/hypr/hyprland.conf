# =============================================================================
#  Hyprland — entry point
# =============================================================================
#  This file only wires modules together. Put actual settings in conf/*.conf.
#
#  SYNTAX: this config uses hyprlang (`hyprland.conf`).
#  Hyprland >=0.55 deprecates hyprlang in favour of Lua (`hyprland.lua`), but
#  still falls back to hyprlang when no hyprland.lua exists. Docs matching THIS
#  syntax live at https://wiki.hypr.land/0.54.0/ — the unversioned wiki pages
#  now document the Lua API instead.
#
#  ORDER MATTERS: programs.conf defines $terminal/$menu/$fileManager, which
#  keybinds.conf consumes. Keep it sourced first.
# =============================================================================

source = ~/.config/hypr/conf/programs.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/permissions.conf
source = ~/.config/hypr/conf/looknfeel.conf
source = ~/.config/hypr/conf/layouts.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/gestures.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/windowrules.conf
source = ~/.config/hypr/conf/misc.conf
