# Hotkeys, layout and animation for ume; it reloads this file when it changes.

[layout]
gaps = 10
padding = 10

[animation]
# Move animation in milliseconds, at most 1000; 0 moves windows at once.
duration_ms = 250

[mouse]
focus_follows_mouse = true
mouse_follows_focus = false

[opacity]
# The focused window at active, the others at inactive. alt-o turns the focused
# window's off and on, alt-shift-o both.
enabled = true
active = 0.95
inactive = 0.85

[border]
enabled = false
width = 3
color = "#c678dd"

[bindings]
"alt-h" = "window focus west"
"alt-j" = "window focus south"
"alt-k" = "window focus north"
"alt-l" = "window focus east"
"alt-shift-h" = "window swap west"
"alt-shift-j" = "window swap south"
"alt-shift-k" = "window swap north"
"alt-shift-l" = "window swap east"
"ctrl-alt-h" = "window resize west 20"
"ctrl-alt-j" = "window resize south 20"
"ctrl-alt-k" = "window resize north 20"
"ctrl-alt-l" = "window resize east 20"
"ctrl-alt-shift-h" = "window resize west -20"
"ctrl-alt-shift-j" = "window resize south -20"
"ctrl-alt-shift-k" = "window resize north -20"
"ctrl-alt-shift-l" = "window resize east -20"
"alt-f" = "window zoom"
"alt-d" = "window zoom-parent"
"alt-e" = "window split"
"alt-a" = "space gaps"
"ctrl-alt-r" = "space gather"
"alt-r" = "space rotate 270; space balance"
"alt-shift-r" = "space rotate 90; space balance"
"alt-y" = "space mirror horizontal"
"alt-x" = "space mirror vertical"
"alt-shift-0" = "space balance"
"ctrl-alt-z" = "space layout bsp"
"ctrl-alt-x" = "space layout float"
"ctrl-alt-c" = "space layout stack"
"alt-comma" = "display focus prev"
"alt-period" = "display focus next"
"alt-shift-comma" = "window display prev --follow"
"alt-shift-period" = "window display next --follow"
"alt-return" = "window toggle-float; window grid 20:20:1:1:18:18"
"alt-shift-return" = "window toggle-float; window grid 4:4:1:1:2:2"
"alt-shift-left" = "window grid 1:2:0:0:1:1"
"alt-shift-down" = "window grid 20:20:1:1:18:18"
"alt-shift-up" = "window grid 1:1:0:0:1:1"
"alt-shift-right" = "window grid 1:2:1:0:1:1"
"alt-tab" = "space focus recent"
"alt-p" = "space focus prev"
"alt-n" = "space focus next"
"alt-1" = "space focus 1"
"alt-2" = "space focus 2"
"alt-3" = "space focus 3"
"alt-4" = "space focus 4"
"alt-5" = "space focus 5"
"alt-6" = "space focus 6"
"alt-7" = "space focus 7"
"alt-8" = "space focus 8"
"alt-9" = "space focus 9"
"alt-shift-1" = "window space 1"
"alt-shift-2" = "window space 2"
"alt-shift-3" = "window space 3"
"alt-shift-4" = "window space 4"
"alt-shift-5" = "window space 5"
"alt-shift-6" = "window space 6"
"alt-shift-7" = "window space 7"
"alt-shift-8" = "window space 8"
"alt-shift-9" = "window space 9"
"alt-o" = "opacity focused"
"alt-shift-o" = "opacity toggle"
"ctrl-alt-t" = "exec ~/.config/ghostty/toggle-opacity.sh && osascript -e 'tell application \"System Events\" to keystroke \"r\" using command down'"
"alt-shift-f" = "exec ~/.local/bin/notchfs"
"alt-shift-n" = "exec ~/.local/bin/notchkiller"

# Reloads the Dock payload at login and after every Dock restart.
[[signal]]
event = "helper_lost"
action = "~/.local/bin/ume-load-dock"
