# Miku theme for the status bar.

%hidden TEAL="#00D9FF"
%hidden PILLC="#00c8eb"
%hidden PILLC_WAIT="#ff5ab9"
%hidden TEAL_DIM="#2aa9c9"
%hidden PINK="#FF79C6"
%hidden INK="#061a22"
%hidden FG="#c8d3d5"
%hidden MUTED="#6c7a89"
%hidden FAINT="#3b4a54"
%hidden SURFACE="#1b2a33"

# Icon per running program.
%hidden ICON="#{?#{m/r:^claude$,#{pane_current_command}},#{?#{==:#{@claude_state},busy},#{@spin},#{?#{==:#{@claude_state},wait},#{@blink},󰛄}},#{?#{m/r:^codex$,#{pane_current_command}},󰛡,#{?#{m/r:^gemini$,#{pane_current_command}},󰫢,#{?#{m/r:^opencode$,#{pane_current_command}},#{?#{==:#{@claude_state},busy},#{@ocspin},#{?#{==:#{@claude_state},wait},#{@blink},󱜙}},#{?#{m/r:^(aider|qwen)$,#{pane_current_command}},󱜙,#{?#{m/r:^n?vim$,#{pane_current_command}},,#{?#{m/r:^(ssh|mosh)$,#{pane_current_command}},󰣀,#{?#{m/r:^(node|bun|deno|npm|pnpm)$,#{pane_current_command}},,#{?#{m/r:^(cargo|rustc)$,#{pane_current_command}},,#{?#{m/r:^(python.*|uv)$,#{pane_current_command}},,#{?#{m/r:^(yazi|lf)$,#{pane_current_command}},󰇥,#{?#{m/r:^(htop|btop|top)$,#{pane_current_command}},,#{?#{m/r:^(git|lazygit)$,#{pane_current_command}},,#{?#{m/r:^(docker|orb)$,#{pane_current_command}},,}}}}}}}}}}}}}}"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=$FG"
set -g status-left-length 40
set -g status-right-length 120

# Session pill, pink while prefix is held.
set -g status-left "#{?client_prefix,#[fg=$PILLC_WAIT],#[fg=$PILLC]}#{?client_prefix,#[bg=$PILLC_WAIT],#[bg=$PILLC]}#[fg=$INK,bold]󰝚 #S #[bg=default,nobold]#{?client_prefix,#[fg=$PILLC_WAIT],#[fg=$PILLC]} "

set -g window-status-separator ""
set -g window-status-format "#[fg=$MUTED]  #{?#{==:#{@claude_state},wait},#[fg=$PINK],#{?#{m/r:^(busy|done)$,#{@claude_state}},#[fg=$TEAL],}}$ICON#[fg=$MUTED] #I #W#{?#{==:#{@claude_state},done},#[fg=$TEAL] •,}#{?window_zoomed_flag,#[fg=$PINK] 󰊓,}#{?window_bell_flag,#[fg=$PINK] 󰂞,} "
set -g window-status-current-format " #[fg=#{?#{==:#{@claude_state},wait},$PILLC_WAIT,$PILLC}]#[bg=#{?#{==:#{@claude_state},wait},$PILLC_WAIT,$PILLC},fg=$INK,bold]$ICON #I #W#{?window_zoomed_flag, 󰊓,}#[bg=default,fg=#{?#{==:#{@claude_state},wait},$PILLC_WAIT,$PILLC},nobold]"
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-activity-style "fg=$PINK"
set -g window-status-bell-style "fg=$PINK,bold"

# continuum_save.sh must stay in status-right.
set -g status-right "#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
set -ag status-right "#{?#{e|>=:#{client_width},140},#[fg=$TEAL_DIM]  #[fg=$MUTED]#{=/-24/…:#{s|^$HOME|~|:pane_current_path}} ,}"
set -ag status-right "#{?#{e|>=:#{client_width},140},#[fg=$TEAL_DIM]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null | sed 's/^/ /') ,}"
set -ag status-right "#{?#{e|>=:#{client_width},120},  #(~/.config/tmux/scripts/meters.sh)  ,}"
set -ag status-right "#{?#{e|>=:#{client_width},100},#[fg=$SURFACE]#[bg=$SURFACE#,fg=$TEAL]#{@miku}#[bg=default#,fg=$SURFACE],}"


# Clear the unseen-done mark on visit.
set-hook -g session-window-changed 'if -F "#{==:#{@claude_state},done}" "set -w @claude_state idle"'
set-hook -g client-session-changed 'if -F "#{==:#{@claude_state},done}" "set -w @claude_state idle"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g pane-border-style "fg=$FAINT"
set -g pane-active-border-style "fg=$TEAL"
set -g pane-border-lines single
set -g display-panes-colour "$MUTED"
set -g display-panes-active-colour "$TEAL"
set -g message-style "bg=$SURFACE,fg=$TEAL"
set -g message-command-style "bg=$SURFACE,fg=$PINK"
set -g mode-style "bg=$TEAL_DIM,fg=$INK"
set -g copy-mode-match-style "bg=$FAINT,fg=$FG"
set -g copy-mode-current-match-style "bg=$PINK,fg=$INK"
set -g tree-mode-selection-style "bg=$SURFACE,fg=$TEAL,bold"
set -g popup-border-style "fg=$TEAL"
set -g popup-border-lines rounded
set -g menu-border-style "fg=$TEAL"
set -g menu-border-lines rounded
set -g menu-selected-style "bg=$TEAL_DIM,fg=$INK"
set -g clock-mode-colour "$TEAL"

run-shell -b '~/.config/tmux/scripts/ticker.sh'
