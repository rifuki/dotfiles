# === Reload Config ===
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Configuration Reloaded!'

set -g extended-keys

# === Basic Settings Handled by tmux-sensible, but explicitly set due to issues ===
set -g prefix C-b                   # Set prefix to Ctrl + b
set -g mouse on                     # Enable native tmux mouse support
unbind-key -n WheelUpPane
unbind-key -n WheelDownPane
# Touchpad/wheel scroll should enter tmux scrollback for shell output, while
# full-screen apps that use the alternate screen still receive mouse events.
bind-key -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode}}" "send-keys -M" "copy-mode -e"
set -g base-index 1                 # Start window numbering from 1 (default is
set -g renumber-windows on          # Auto-renumber windows after closing one
set -g default-terminal "tmux-256color"  # Better tmux terminal (supports truecolor + capabilities)
set -sa terminal-features ",xterm-ghostty:RGB"
set -sa terminal-features ",xterm-256color:RGB"
set -g escape-time 10
set -g history-limit 500000            # Keep a large scrollback buffer per pane
set -g status-interval 1                 # Refresh status bar every 1 second (needed for dynamic width check)
set -g status-right-length 80
set -g allow-passthrough on              # Allow passthrough for image rendering (image.nvim, yazi)
set -g focus-events on                   # Send focus events to panes (enables FocusLost in nvim)
# Propagate terminal identity vars so yazi/image.nvim detect Ghostty's Kitty protocol inside tmux
set -ga update-environment TERM_PROGRAM
set -ga update-environment COLORTERM
set -ga update-environment GHOSTTY_RESOURCES_DIR
setw -g mode-keys vi                # Enable Vi keybindings in copy mode

# === Vim-like Navigation for Pane Movement  ===
bind-key h select-pane -L   # Move to the left pane
bind-key j select-pane -D   # Move to the bottom pane
bind-key k select-pane -U   # Move to the top pane
bind-key l select-pane -R   # Move to the right pane

# === Plugin Settings ===
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

# List of installed plugins
set -g @plugin 'tmux-plugins/tpm'               # Must installed (git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm., then Control + I)
set -g @plugin 'tmux-plugins/tmux-yank'         # Improves copy-paste functionality in tmux
# set -g @plugin 'tmux-plugins/tmux-sensible'     # Better default settings for tmux (disabled due to issues)
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Saves & restores tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # Automates session saving
# Disabled on tmux 3.6a: this overrides wheel scrolling with aggressive copy-mode
# commands and has been involved in macOS tmux server crashes.
# set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-cpu'          # Displays CPU usage in the status bar
set -g @plugin 'tmux-plugins/tmux-battery'      # Displays battery status in the status bar

# === Resurrect & Continuum Settings ===
set -g @continuum-save-interval 5       # Automatically save session every 5 minutes
set -g @continuum-restore 'on'          # Restore session automatically when tmux starts
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~opencode->opencode *" "~zeroclaw->~/.local/bin/zeroclaw daemon" "~claude-resume.sh->~/.config/tmux/scripts/claude-resume.sh *"'
# Each Claude pane is saved with its own conversation, so a restore resumes it.
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/claude-panes-save.sh'
set -g @resurrect-hook-post-save-all '~/.config/tmux/scripts/claude-panes-keep.sh'

# Fallback title when empty (resurrect corrupts empty-title panes); covers non-shell
# panes the zsh precmd hook can't reach. Leaves a program's own title untouched.
set-hook -g pane-focus-in  "select-pane -T '#{?#{==:#{pane_title},},#{b:pane_current_path},#{pane_title}}'"
set-hook -g pane-focus-out "select-pane -T '#{?#{==:#{pane_title},},#{b:pane_current_path},#{pane_title}}'"

# === Load Plugins ===
run '~/.config/tmux/plugins/tpm/tpm'

# Keep pre-3.8 terminal colours.
set -g theme terminal


# === Theme ===
source-file ~/.config/tmux/miku.conf
# run '~/.config/tmux/plugins/tmux-battery/battery.tmux'
# run 'tmux source-file ~/.config/tmux/scripts/net_speed_module.conf'

